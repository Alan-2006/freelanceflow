[project]
name = "freelanceflow"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15.0",
    "django-environ>=0.11.0",
    "psycopg2-binary>=2.9.9; sys_platform != 'win32'",
    "django-apscheduler>=0.6.2",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "Pillow>=10.3.0",
    "qrcode>=7.4.2",
    "razorpay>=1.4.1",
    "stripe>=16.0.0",
    "requests>=2.31.0",
    "whitenoise>=6.6.0",
    "reportlab>=4.2.0",
]

[tool.black]
line-length = 100
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F403", "F405"]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --tb=short"
