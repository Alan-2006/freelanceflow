{% extends 'base.html' %}

{% block title %}Reset Password - FreelanceFlow{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8 relative z-10">
    <div class="max-w-md w-full brutal-card p-8 sm:p-10 border-2 border-slate-900 dark:border-indigo-400 shadow-[6px_6px_0px_#0f172a] dark:shadow-[6px_6px_0px_#6366f1]">
        <div class="text-center mb-6">
            <div class="h-12 w-12 rounded-2xl bg-indigo-600 mx-auto flex items-center justify-center text-white border-2 border-slate-900 shadow-[3px_3px_0px_#0f172a]">
                <i data-lucide="key" class="w-6 h-6"></i>
            </div>
            <h2 class="mt-4 text-2xl font-extrabold font-heading text-slate-900 dark:text-white">Reset Password</h2>
            <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
                Enter your account email to receive a secure password reset link.
            </p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
                <input type="email" name="email" required autocomplete="email"
                       class="w-full text-sm px-3.5 py-2.5 rounded-xl border-2 border-slate-900 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-[2px_2px_0px_#0f172a]"
                       placeholder="you@domain.com">
            </div>

            <button type="submit" class="brutal-btn brutal-btn-primary w-full py-3 px-4 text-sm font-bold flex items-center justify-center gap-2">
                <i data-lucide="send" class="w-4 h-4"></i>
                <span>Send Reset Link</span>
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800 text-center">
            <a href="{% url 'authentication:login' %}" class="text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:underline">
                &larr; Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
