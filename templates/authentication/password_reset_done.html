{% extends 'base.html' %}

{% block title %}Password Reset Sent - FreelanceFlow{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8 relative z-10">
    <div class="max-w-md w-full brutal-card p-8 sm:p-10 border-2 border-slate-900 dark:border-indigo-400 shadow-[6px_6px_0px_#0f172a] dark:shadow-[6px_6px_0px_#6366f1] text-center space-y-4">
        <div class="h-12 w-12 rounded-2xl bg-emerald-500 mx-auto flex items-center justify-center text-white border-2 border-slate-900 shadow-[3px_3px_0px_#0f172a]">
            <i data-lucide="mail-check" class="w-6 h-6"></i>
        </div>
        <h2 class="text-2xl font-extrabold font-heading text-slate-900 dark:text-white">Check Your Inbox</h2>
        <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
            We have emailed you instructions for setting a new password, if an account exists with the email you entered.
        </p>
        <div class="pt-4">
            <a href="{% url 'authentication:login' %}" class="brutal-btn brutal-btn-secondary inline-flex items-center gap-2 py-2 px-4 text-xs font-bold">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                <span>Return to Sign In</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
