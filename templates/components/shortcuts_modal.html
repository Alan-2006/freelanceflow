<!-- Keyboard Shortcuts Help Modal -->
<div x-show="shortcutsModalOpen" 
     x-transition
     class="fixed inset-0 z-50 overflow-y-auto p-4 sm:p-6 md:p-20 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center"
     @click.away="shortcutsModalOpen = false"
     style="display: none;">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4"
         @click.stop>
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
            <h3 class="text-base font-bold font-heading text-slate-900 dark:text-white flex items-center gap-2">
                <i data-lucide="keyboard" class="w-4 h-4 text-indigo-500"></i>
                Keyboard Shortcuts
            </h3>
            <button @click="shortcutsModalOpen = false" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <div class="space-y-2.5 text-xs">
            <div class="flex items-center justify-between py-1.5 border-b border-slate-100 dark:border-slate-800/60">
                <span class="text-slate-600 dark:text-slate-400">Open Command Palette / Search</span>
                <kbd class="px-2 py-0.5 font-mono bg-slate-100 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700">Ctrl + K</kbd>
            </div>
            <div class="flex items-center justify-between py-1.5 border-b border-slate-100 dark:border-slate-800/60">
                <span class="text-slate-600 dark:text-slate-400">Create New Invoice</span>
                <kbd class="px-2 py-0.5 font-mono bg-slate-100 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700">N</kbd>
            </div>
            <div class="flex items-center justify-between py-1.5 border-b border-slate-100 dark:border-slate-800/60">
                <span class="text-slate-600 dark:text-slate-400">Toggle Persistent Navbar Timer</span>
                <kbd class="px-2 py-0.5 font-mono bg-slate-100 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700">T</kbd>
            </div>
            <div class="flex items-center justify-between py-1.5 border-b border-slate-100 dark:border-slate-800/60">
                <span class="text-slate-600 dark:text-slate-400">Close Modals / Overlays</span>
                <kbd class="px-2 py-0.5 font-mono bg-slate-100 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700">ESC</kbd>
            </div>
            <div class="flex items-center justify-between py-1.5">
                <span class="text-slate-600 dark:text-slate-400">Show Shortcuts Help</span>
                <kbd class="px-2 py-0.5 font-mono bg-slate-100 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700">?</kbd>
            </div>
        </div>
    </div>
</div>
