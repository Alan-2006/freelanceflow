<!-- Keyboard Shortcuts Help Modal -->
<div x-show="shortcutsModalOpen" 
     x-transition
     class="fixed inset-0 z-50 overflow-y-auto p-4 sm:p-6 md:p-20 bg-slate-950/70 backdrop-blur-md flex justify-center items-center"
     @click.away="shortcutsModalOpen = false"
     style="display: none;">
    <div class="brutal-card bg-white dark:bg-slate-900 border-2 border-slate-900 dark:border-indigo-400 rounded-2xl p-6 max-w-md w-full shadow-[6px_6px_0px_#0f172a] dark:shadow-[6px_6px_0px_#6366f1] space-y-4"
         @click.stop>
        <div class="flex items-center justify-between pb-3 border-b-2 border-slate-900/10 dark:border-white/10">
            <h3 class="text-base font-extrabold font-heading text-slate-900 dark:text-white flex items-center gap-2">
                <i data-lucide="keyboard" class="w-4 h-4 text-indigo-500"></i>
                // Keyboard Shortcuts
            </h3>
            <button @click="shortcutsModalOpen = false" class="p-1 text-slate-400 hover:text-rose-500"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <div class="space-y-2.5 text-xs">
            <div class="flex items-center justify-between py-2 border-b border-slate-900/10 dark:border-white/10">
                <span class="font-medium text-slate-700 dark:text-slate-300">Open Command Palette / Search</span>
                <kbd class="px-2 py-0.5 font-mono font-bold bg-white dark:bg-slate-800 rounded border-2 border-slate-900 dark:border-white/30 shadow-[2px_2px_0px_#0f172a]">Ctrl + K</kbd>
            </div>
            <div class="flex items-center justify-between py-2 border-b border-slate-900/10 dark:border-white/10">
                <span class="font-medium text-slate-700 dark:text-slate-300">Create New Invoice</span>
                <kbd class="px-2 py-0.5 font-mono font-bold bg-white dark:bg-slate-800 rounded border-2 border-slate-900 dark:border-white/30 shadow-[2px_2px_0px_#0f172a]">N</kbd>
            </div>
            <div class="flex items-center justify-between py-2 border-b border-slate-900/10 dark:border-white/10">
                <span class="font-medium text-slate-700 dark:text-slate-300">Toggle Persistent Navbar Timer</span>
                <kbd class="px-2 py-0.5 font-mono font-bold bg-white dark:bg-slate-800 rounded border-2 border-slate-900 dark:border-white/30 shadow-[2px_2px_0px_#0f172a]">T</kbd>
            </div>
            <div class="flex items-center justify-between py-2 border-b border-slate-900/10 dark:border-white/10">
                <span class="font-medium text-slate-700 dark:text-slate-300">Close Modals / Overlays</span>
                <kbd class="px-2 py-0.5 font-mono font-bold bg-white dark:bg-slate-800 rounded border-2 border-slate-900 dark:border-white/30 shadow-[2px_2px_0px_#0f172a]">ESC</kbd>
            </div>
            <div class="flex items-center justify-between py-2">
                <span class="font-medium text-slate-700 dark:text-slate-300">Show Shortcuts Help</span>
                <kbd class="px-2 py-0.5 font-mono font-bold bg-white dark:bg-slate-800 rounded border-2 border-slate-900 dark:border-white/30 shadow-[2px_2px_0px_#0f172a]">?</kbd>
            </div>
        </div>
    </div>
</div>
